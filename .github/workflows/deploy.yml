name: Deploy to GitHub Pages

# Fires on every push to main plus a manual "Run workflow" button in the
# Actions tab. Also runs on pull_request so PRs get a green/red check
# without deploying anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Grants the workflow the minimum permissions it needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time — a newer push should supersede any in-flight run
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        # Uploads dist/ as the artifact the deploy-pages step consumes.
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only publish on pushes to main / manual runs, not on PR builds — PRs
    # should validate (build passes) without touching the live site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
