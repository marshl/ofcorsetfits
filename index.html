    <!-- Great Vibes powers the cursive site title in .app-header h1.
         preconnect keeps the font handshake fast; display=swap paints
         the fallback ('cursive') until the file loads so the header
         doesn't sit blank on a slow connection. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" />
    <title>ofcorsetfits</title>
  </head>
